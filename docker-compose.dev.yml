services:
  frontend-dev:
    image: node:22
    working_dir: /src
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/src
      - front_node_modules_dev:/src/node_modules
    command: >
      sh -c "[ -d node_modules/.bin ] || npm install &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  front_node_modules_dev:
