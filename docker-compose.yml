services:
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    # Меньше шума в stdout (подключения, metadata и т.д.)
    command: ["mongod", "--quiet", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: microavito
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPYCACHEPREFIX: /cache/pycache
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - api_pycache:/cache/pycache
      - /app/.pytest_cache
    depends_on:
      mongodb:
        condition: service_healthy

  frontend-build:
    image: node:22
    working_dir: /src
    restart: "no"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./frontend:/src
      - front_node_modules:/src/node_modules
      - front_dist:/out
    command: >
      sh -c "[ -d node_modules/.bin ] || npm install &&
             npm run build &&
             rm -rf /out/* &&
             cp -r /src/dist/. /out/"

  nginx:
    image: nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - front_dist:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_started

volumes:
  mongo_data:
  uploads:
  front_dist:
  front_node_modules:
  api_pycache:
